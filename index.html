<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>滝行妄想退治</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1c26; --paper:#f3ead6; --shu:#d4452f; --moss:#5b7d4c; --gold:#f0c65a; --mist:#cfe6f2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0f1c26; --paper:#f3ead6; } }
:root[data-theme="dark"]{ --ink:#0f1c26; --paper:#f3ead6; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;
  display:flex;gap:12px;align-items:center;justify-content:space-between}
#gaugeWrap{flex:1;max-width:420px;display:flex;align-items:center;gap:8px}
#gaugeWrap span.lbl{font-family:"Dela Gothic One",sans-serif;font-size:15px;letter-spacing:.05em}
#gauge{flex:1;height:14px;border-radius:8px;background:rgba(255,255,255,.12);border:2px solid var(--paper);overflow:hidden}
#gaugeFill{height:100%;width:0;background:var(--moss);transition:width .2s,background .3s}
#gaugeFill.hot{background:var(--shu)}
#gaugePct{font-weight:900;font-size:14px;min-width:3.2em;text-align:right}
#kills{font-weight:900;font-size:15px;white-space:nowrap}
#kills b{font-family:"Dela Gothic One",sans-serif;font-size:20px;color:var(--gold)}
#mute{pointer-events:auto;background:rgba(255,255,255,.1);border:2px solid var(--paper);color:var(--paper);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
#mute:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-family:"Dela Gothic One",sans-serif;
  font-size:clamp(26px,7vw,54px);color:var(--paper);-webkit-text-stroke:2px var(--shu);text-shadow:0 4px 0 var(--shu);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:scale(1)}
#combo{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 60px);font-family:"Dela Gothic One",sans-serif;font-size:22px;color:var(--gold);opacity:0;transition:opacity .2s;pointer-events:none}
#combo.on{opacity:1}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(10,20,28,.55)}
.ov.show{display:flex}
.card{display:flex;flex-direction:row-reverse;gap:18px;max-width:560px;width:100%;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:20px;padding:22px 20px;box-shadow:8px 8px 0 var(--shu);max-height:100%;overflow:auto}
.tate{writing-mode:vertical-rl;font-family:"Dela Gothic One",sans-serif;font-weight:400;margin:0;font-size:clamp(40px,11vw,68px);line-height:1.05;color:var(--ink);letter-spacing:.06em}
.body{flex:1;font-size:15px;line-height:1.85}
.body p{margin:0 0 .7em}
.lead{font-weight:900;font-size:17px}
.stats{font-weight:700;border-top:2px dashed var(--ink);padding-top:.6em}
.body button{margin-top:.4em;width:100%;padding:14px;border:3px solid var(--ink);border-radius:14px;background:var(--shu);color:var(--paper);
  font-family:"Dela Gothic One",sans-serif;font-size:20px;cursor:pointer}
.body button:active{transform:translateY(2px)}
.gods{font-size:13px;opacity:.8}
.title-entry{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(92vw,420px);padding:14px;border:3px solid var(--ink);border-radius:14px;background:var(--shu);color:var(--paper);font-family:"Dela Gothic One",sans-serif;font-size:20px;cursor:pointer}
body:not(.at-title) .title-entry{display:none}
</style>

<body class="at-title">

<div id="title" class="ov show">
  <div class="card">
    <h1 class="tate">滝行妄想退治</h1>
    <div class="body">
      <p class="lead">和尚、滝に打たれ中。<br>なのに頭の中は、まんじゅうとラーメンでいっぱい。</p>
      <p>浮かんだ妄想をタップすると、見守る八百万の神が弓で射抜く。</p>

      <p>ときどき滝が荒ぶる「荒業」タイム。寒さで妄想が止まらなくなる。</p>
      <p><b>108個</b>射抜けば、悟り。</p>
      <p class="gods">出演：射抜ノ神／早矢比売／飯断ノ神／眠気祓ノ尊／無心大明神</p>

  </div>
</div>

<div id="hud">
  <div id="gaugeWrap"><span class="lbl">煩悩</span><div id="gauge"><div id="gaugeFill"></div></div><span id="gaugePct">0%</span></div>

      <p id="resMsg"></p>

  </div>
</div>

<div id="err" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:#f3ead6;color:#0f1c26;border:3px solid #d4452f;border-radius:12px;padding:10px 12px;font-size:13px;z-index:9;white-space:pre-wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.startMain=()=>{
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ============ 妄想データ ============ */
const THOUGHTS=[
 {t:'まんじゅう食いたいな',e:'🍡',food:1,kids:['こしあん派','いや、つぶあん']},
 {t:'温かい風呂に入りたい',e:'♨️'},
 {t:'帰ってゲームしたい',e:'🎮',type:'fast',kids:['あと1面だけ','ガチャ回したい']},
 {t:'ラーメン大盛り',e:'🍜',food:1,type:'big',kids:['チャーハン追加','餃子もつけて']},
 {t:'金持ちになりてー',e:'💰',kids:['札束の風呂','宝くじ当たれ']},
 {t:'松茸の季節だなあ',e:'🍄',food:1,kids:['土瓶蒸し…','焼き松茸にすだち']},
 {t:'爆睡してー',e:'💤',type:'big',kids:['二度寝したい','昼寝もしたい']},
 {t:'甘い桃が食べたい',e:'🍑',food:1},
 {t:'ビールぐいっと',e:'🍺',food:1,kids:['枝豆もほしい']},
 {t:'猫をなでたい',e:'🐈'},
 {t:'焼肉食べ放題',e:'🥩',food:1,kids:['タン塩から','〆は冷麺']},
 {t:'布団から出たくない',e:'🛏️'},
 {t:'Wi-Fiどこ？',e:'📶',type:'fast'},
 {t:'今日の晩ごはん何？',e:'🍚',food:1},
 {t:'推しに会いたい',e:'✨',type:'fast'},
];
const COLD=[
 {t:'寒い寒い寒い',e:'🥶',type:'fast'},
 {t:'こたつ入りたい',e:'🍊',kids:['みかん食べたい','ずっとこたつ']},
 {t:'熱燗ください',e:'🍶',food:1},
 {t:'温かい風呂に入りたい',e:'♨️',kids:['肩までつかりたい']},
 {t:'おでん食べたい',e:'🍢',food:1,kids:['大根しみしみ']},
];
const GOD_LINES=['来たぞ！','射てーっ！','させるかっ！','まんじゅうは後だ！','和尚、耐えろ！','そこだっ！','手がつる…','見えた！'];
const GOD_PANIC=['やばいやばい','とりついてる！','誰か増援を！','天照さま呼んで！','神の威信が！','矢が足りん！'];
const GOD_SURGE=['和尚が冷えるぞ！','滝が荒ぶってる！','寒さで妄想が！'];
const MONK_LINES=['南無…','無心…無心…','…まんじゅう','冷たくない冷たくない','心頭滅却…','（腹が鳴る）','…ラーメン','むにゃ…'];
const GODS_DEF=[
 {name:'射抜ノ神',robe:0xc8402f},{name:'早矢比売',robe:0x3e7cb1},{name:'飯断ノ神',robe:0x5b8c4a},
 {name:'眠気祓ノ尊',robe:0x8a5aa8},{name:'無心大明神',robe:0xe0b040}
];

/* ============ 基本 ============ */
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){showErr('この端末/ブラウザでは3D（WebGL）が使えないみたい');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10202c);
scene.fog=new THREE.Fog(0x10202c,20,48);
const camera=new THREE.PerspectiveCamera(50,1,0.1,120);
const camBase=new THREE.Vector3(), camLook=new THREE.Vector3(0,6.3,0);
let W=1,H=1,halfW=8,TS=1,ORB=1.7,portrait=false;

scene.add(new THREE.HemisphereLight(0xa9cfe6,0x1a2a20,0.75));
const moonL=new THREE.DirectionalLight(0xfff1d6,0.85); moonL.position.set(-6,12,10); scene.add(moonL);
const goldLight=new THREE.PointLight(0xffd36a,0,12); goldLight.position.set(0,3,2); scene.add(goldLight);

const lam=c=>new THREE.MeshLambertMaterial({color:c});

/* 背景：崖・池・木・月・星 */
const cliff=new THREE.Mesh(new THREE.BoxGeometry(44,22,4),lam(0x1c2a2c)); cliff.position.set(0,8,-3.6); scene.add(cliff);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,40),lam(0x1d2d21)); ground.rotation.x=-Math.PI/2; ground.position.set(0,-0.01,5); scene.add(ground);
const pool=new THREE.Mesh(new THREE.CircleGeometry(6.5,40),new THREE.MeshPhongMaterial({color:0x2d5d72,shininess:80,transparent:true,opacity:.92}));
pool.rotation.x=-Math.PI/2; pool.position.set(0,0.02,0.5); scene.add(pool);
for(let i=0;i<22;i++){
  const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.4,1.3)),lam(i%3?0x2e3b3c:0x3b4d3a));
  const a=rand(0,Math.PI*2), d=rand(6.2,9); r.position.set(Math.cos(a)*d, rand(0,.6), Math.sin(a)*d*0.5-0.5);
  if(r.position.z>3) r.position.z=rand(-2.4,-1.4);
  r.rotation.set(rand(0,3),rand(0,3),0); scene.add(r);
}
for(let i=0;i<5;i++){ // 苔の岩 on cliff edge
  const m=new THREE.Mesh(new THREE.SphereGeometry(rand(.8,1.6),10,8),lam(0x3f5d38));
  m.position.set(rand(-9,9)+(i%2?4:-4), rand(12,16), -1.8); scene.add(m);
}
for(let i=0;i<14;i++){
  const s=rand(-1,1)>0?1:-1, h=rand(3,6);
  const t=new THREE.Mesh(new THREE.ConeGeometry(rand(.9,1.5),h,7),lam(0x1a3322));
  t.position.set(s*rand(7.5,16),h/2,rand(-2,1)); scene.add(t);
}
const moon=new THREE.Mesh(new THREE.SphereGeometry(1.4,20,16),new THREE.MeshBasicMaterial({color:0xfff2c8})); moon.position.set(-13,19,-22); scene.add(moon);
{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<300;i++)a.push(rand(-50,50),rand(14,40),rand(-40,-25));
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xdfe9f2,size:.14})));}

/* 滝 */
function waterCanvas(alpha){const c=document.createElement('canvas');c.width=128;c.height=512;const g=c.getContext('2d');
  g.fillStyle=`rgba(160,205,228,${alpha})`;g.fillRect(0,0,128,512);
  for(let i=0;i<150;i++){const x=Math.random()*128,w=rand(1,5),y=Math.random()*512,h=rand(40,220);
    g.fillStyle=`rgba(255,255,255,${rand(.15,.65)})`;g.fillRect(x,y,w,h);if(y+h>512)g.fillRect(x,y-512,w,h);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const fallTex=waterCanvas(.5); fallTex.repeat.set(2,2.5);
const fall=new THREE.Mesh(new THREE.PlaneGeometry(5,17),new THREE.MeshBasicMaterial({map:fallTex,transparent:true,opacity:.9,depthWrite:false}));
fall.position.set(0,8.4,-1.4); scene.add(fall);
const streamTex=waterCanvas(.35);
const stream=new THREE.Mesh(new THREE.PlaneGeometry(1,11.4),new THREE.MeshBasicMaterial({map:streamTex,transparent:true,opacity:.55,depthWrite:false}));
stream.position.set(0,8.5,0.22); scene.add(stream);

/* しめ縄 */
{const pts=[];for(let i=0;i<=20;i++){const x=lerp(-2.9,2.9,i/20);pts.push(new THREE.Vector3(x,13.4-0.5*Math.cos((i/20-.5)*Math.PI),-0.9));}
 const rope=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,.12,6),lam(0xc9a868)); scene.add(rope);
 for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(.22,.6),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));
   const x=lerp(-2,2,i/3);s.position.set(x,12.6-0.45*Math.cos((x/5.8)*Math.PI)+.1,-0.85);scene.add(s);}}

/* ============ テクスチャ工房 ============ */
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function bubbleTex(text,emoji,kind){
  const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  g.fillStyle=kind==='big'?'#ffd9c2':kind==='fast'?'#dcefff':kind==='child'?'#f7eaff':'#fbf4e2';
  g.strokeStyle='#1c2a33';g.lineWidth=16;
  const lumps=[[130,122,78],[215,92,82],[305,95,84],[388,126,74],[300,162,78],[200,166,78]];
  const tail=[[78,222,18],[44,244,10]];
  g.beginPath();[...lumps,...tail].forEach(([x,y,r])=>{g.moveTo(x+r,y);g.arc(x,y,r,0,Math.PI*2)});g.stroke();g.fill();
  g.textAlign='center';g.textBaseline='middle';
  g.font=`62px ${EMOJI}`;g.fillText(emoji,256,78);
  let fs=kind==='big'?50:44;g.font=`900 ${fs}px ${FONT}`;
  while(g.measureText(text).width>370&&fs>22){fs-=2;g.font=`900 ${fs}px ${FONT}`}
  g.fillStyle='#1c2a33';g.fillText(text,256,158);
  const t=new THREE.CanvasTexture(c);return t;
}
function speechTex(text,bg,fg){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  let fs=50;g.font=`900 ${fs}px ${FONT}`;while(g.measureText(text).width>430&&fs>22){fs-=2;g.font=`900 ${fs}px ${FONT}`}
  const w=Math.min(500,g.measureText(text).width+56),x=(512-w)/2;
  roundRect(g,x,12,w,96,30);g.fillStyle=bg;g.fill();g.lineWidth=6;g.strokeStyle='#1c2a33';g.stroke();
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,62);
  return new THREE.CanvasTexture(c);
}
function labelTex(text){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  g.font=`700 30px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=6;g.strokeStyle='rgba(15,28,38,.9)';g.strokeText(text,128,32);g.fillStyle='#f3ead6';g.fillText(text,128,32);return new THREE.CanvasTexture(c);}
const metsuTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.font='900 100px "Dela Gothic One",serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=10;g.strokeStyle='#f3ead6';g.strokeText('滅',64,68);g.fillStyle='#d4452f';g.fillText('滅',64,68);return c;})();
let metsuTexture=new THREE.CanvasTexture(metsuTex);

function faceTex(draw){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.lineCap='round';g.lineJoin='round';g.strokeStyle='#2a1a12';g.fillStyle='#2a1a12';g.lineWidth=9;draw(g);return new THREE.CanvasTexture(c);}
const closedEye=(g,x,y)=>{g.beginPath();g.arc(x,y-14,24,.2*Math.PI,.8*Math.PI);g.stroke();};
const cheeks=g=>{g.save();g.fillStyle='rgba(230,110,110,.35)';g.beginPath();g.arc(62,160,20,0,7);g.arc(194,160,20,0,7);g.fill();g.restore();};
const sweat=(g,x,y,s=1)=>{g.save();g.fillStyle='#6fc3ff';g.beginPath();g.moveTo(x,y-18*s);g.quadraticCurveTo(x+14*s,y+4*s,x,y+10*s);g.quadraticCurveTo(x-14*s,y+4*s,x,y-18*s);g.fill();g.restore();};
const MONK_FACE={
 calm:faceTex(g=>{closedEye(g,80,118);closedEye(g,176,118);g.beginPath();g.moveTo(60,78);g.lineTo(100,74);g.moveTo(156,74);g.lineTo(196,78);g.stroke();g.beginPath();g.moveTo(110,192);g.lineTo(146,192);g.stroke();cheeks(g);}),
 drool:faceTex(g=>{closedEye(g,80,118);closedEye(g,176,118);g.beginPath();g.moveTo(60,80);g.lineTo(100,84);g.moveTo(156,84);g.lineTo(196,80);g.stroke();
   g.beginPath();g.ellipse(128,188,22,16,0,0,7);g.fill();g.save();g.strokeStyle='#7fd0ff';g.lineWidth=7;g.beginPath();g.moveTo(142,198);g.quadraticCurveTo(150,222,146,248);g.stroke();g.restore();cheeks(g);}),
 peek:faceTex(g=>{closedEye(g,80,118);g.beginPath();g.arc(176,112,20,0,7);g.save();g.fillStyle='#fff';g.fill();g.restore();g.stroke();g.beginPath();g.arc(170,114,8,0,7);g.fill();
   g.beginPath();g.moveTo(60,78);g.lineTo(100,74);g.moveTo(152,82);g.lineTo(198,66);g.stroke();g.beginPath();g.moveTo(112,194);g.quadraticCurveTo(128,184,144,194);g.stroke();}),
 strain:faceTex(g=>{g.beginPath();g.moveTo(62,104);g.lineTo(96,118);g.lineTo(62,132);g.moveTo(194,104);g.lineTo(160,118);g.lineTo(194,132);g.stroke();

let AC=null,master=null,waterGain=null,waterFilter=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  waterFilter=AC.createBiquadFilter();waterFilter.type='lowpass';waterFilter.frequency.value=900;
  waterGain=AC.createGain();waterGain.gain.value=.35;src.connect(waterFilter);waterFilter.connect(waterGain);waterGain.connect(master);src.start();
}
function tone(f,dur,type='sine',vol=.2,to=null,delay=0){if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function noiseHit(dur,vol,hp){if(!AC)return;const t=AC.currentTime;const n=AC.createBufferSource();const b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate);
  const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f);f.connect(g);g.connect(master);n.start(t);}

function updArrows(dt){
  for(let i=arrows.length-1;i>=0;i--){const ar=arrows[i];ar.life-=dt;
    let dest=null;
    if(ar.target&&ar.target.state!=='dead')dest=ar.target.sp.position;
    else if(ar.point)dest=ar.point;
    if(dest&&!ar.dead){tmpV.subVectors(dest,ar.g.position);const dist=tmpV.length();const step=24*dt;
      tmpV.normalize();ar.g.quaternion.setFromUnitVectors(UP,tmpV);ar.dir=tmpV.clone();
      if(dist<=Math.max(.3,step)){
        if(ar.target&&ar.target.state!=='dead'){const th=ar.target;th.hp--;th.bump=.18;SFX.hit();burst(th.sp.position,'#ffffff',8,3);
          if(th.hp<=0)killThought(th);}
        else burst(dest,'#cfe6f2',6,2);

      }else ar.g.position.addScaledVector(tmpV,step);

    const sx=(tmpV.x+1)/2*W,sy=(1-tmpV.y)/2*H;const d=Math.hypot(sx-x,sy-y);
    const dist=camera.position.distanceTo(th.sp.position);const sw=th.sp.scale.x/(2*dist*tv*camera.aspect)*W;
    const thr=Math.max(46,sw*.48);if(d<thr&&d-thr<bd){bd=d-thr;best=th;}});
  if(best)fireAt(best);
  else{tmpV.set(x/W*2-1,-(y/H)*2+1,.5).unproject(camera).sub(camera.position).normalize();
    const k=(1-camera.position.z)/tmpV.z;fireAt(null,camera.position.clone().addScaledVector(tmpV,k));}
},{passive:false});

/* ============ UI ============ */
function banner(txt,ms=1400){const b=$('banner');b.textContent=txt;b.classList.add('on');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('on'),ms);}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.8;};
function updHud(){$('gaugeFill').style.width=Math.min(100,gauge)+'%';$('gaugeFill').classList.toggle('hot',gauge>=60);
  $('gaugePct').textContent=Math.min(100,Math.round(gauge))+'%';$('killN').textContent=Math.min(kills,108);}

function resetGame(){
  thoughts.forEach(th=>{if(th.state!=='dead'){scene.remove(th.sp);th.tex.dispose();th.mat.dispose();}});thoughts.length=0;
  arrows.forEach(a=>scene.remove(a.g));arrows.length=0;
  pops.forEach(p=>{scene.remove(p.sp);p.sp.material.dispose();});pops.length=0;
  speeches.forEach(s=>s.life=0);
  kills=0;combo=0;maxCombo=0;gauge=0;surge=0;surgeK=0;surgeT=20;spawnT=2.2;lastStuck=null;
  monk.rotation.set(0,0,0);monk.position.set(0,.78,.2);robeMat.color.set(0xece6d3);halo.material.opacity=0;goldLight.intensity=0;
  monkMood='calm';monkMoodT=0;gods.forEach(gd=>{gd.g.position.copy(gd.base);setGodFace(gd,'focus');gd.cd=0;});
  camera.position.copy(camBase);camera.lookAt(camLook);updHud();
}
function startGame(){
  initAudio();resetGame();state='play';startT=t;
  document.body.classList.remove('at-title');$('title').classList.remove('show');$('result').classList.remove('show');
  SFX.gong();banner('修行、開始');
  setTimeout(()=>speak(monkOwner,'心頭滅却…',{parent:monk,off:new THREE.Vector3(portrait?-1.3:-1.8,2.3,.4),life:1.8}),600);
}
function doFail(){state='fail';endT=0;SFX.fail();setMonkFace('despair');monkMood='despair';
  gods.forEach(gd=>setGodFace(gd,'down'));godSpeak(['あぁ…','我らの力不足…','和尚ーっ！'],true);
  banner('修行失敗',2200);setTimeout(()=>showResult(false),2800);}
function doClear(){state='clear';endT=0;SFX.clear();setMonkFace('satori');monkMood='satori';
  thoughts.forEach(th=>{if(th.state!=='dead')killThought(th,true);});
  gods.forEach(gd=>setGodFace(gd,'cheer'));godSpeak(['悟ったーっ！','万歳！','打ち上げだ！'],true);
  banner('悟り',2200);setTimeout(()=>showResult(true),3200);}
function showResult(win){
  const sec=Math.round(t-startT);
  $('resTitle').textContent=win?'悟りを開く':'修行失敗';
  $('resLead').textContent=win?'煩悩108、すべて射抜いた。':`「${lastStuck?lastStuck.t:'まんじゅう食いたいな'}」に負けた。`;
  $('resMsg').textContent=win?'和尚、ついに無心。八百万の神々は泣きながら肩を組んでいる。':'和尚は滝の中で遠い目をしている。神々は弓を置き、そっと目をそらした。';
  $('resStats').innerHTML=`撃破 ${Math.min(kills,108)}／108　最大連射 ${maxCombo}　修行時間 ${sec}秒`;
  $('result').classList.add('show');$('againBtn').focus();
}
$('startBtn').onclick=startGame;$('againBtn').onclick=startGame;

/* ============ メインループ ============ */
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);t+=dt;speakCD-=dt;

  // 荒業
  if(state==='play'){surgeT-=dt;
    if(surge>0){surge-=dt;}
    else if(surgeT<=0){surge=6.5;surgeT=rand(20,26);SFX.surge();banner('荒業！ 滝、増量中');godSpeak(GOD_SURGE,true);
      spawnThought(pick(COLD),MONK_HEAD.clone());}
  }else surge=Math.max(0,surge-dt);
  surgeK=lerp(surgeK,surge>0?1:0,dt*3);
  fallTex.offset.y+=dt*(1.4+surgeK*1.8);streamTex.offset.y+=dt*(1.8+surgeK*2.2);
  stream.scale.x=1+surgeK*1.4+Math.sin(t*20)*.05;stream.material.opacity=.5+surgeK*.35;fall.scale.x=1+surgeK*.25;
  if(waterGain){waterGain.gain.value=.3+surgeK*.3;waterFilter.frequency.value=800+surgeK*900;}

  // 水しぶき
  const nBase=Math.floor(dt*70*(1+surgeK*1.5)+Math.random());
  for(let i=0;i<nBase;i++)emit(rand(-2.3,2.3),.15,rand(-1.3,-.4),rand(-1,1),rand(1.5,3.8),rand(0,1.6),rand(.5,.9),'#cfe6f2');
  if(state!=='clear'){const nHead=Math.floor(dt*45*(1+surgeK*2)+Math.random());
    const hy=monk.position.y+2.1;for(let i=0;i<nHead;i++)emit(rand(-.3,.3),hy,rand(0,.4),rand(-2.4,2.4),rand(.8,2.6),rand(-.4,1.6),rand(.3,.6),'#e8f5fb');}

  // 妄想の発生
  if(state==='play'){spawnT-=dt;
    if(spawnT<=0){const interval=Math.max(.62,2.3-kills*.015)*(surge>0?.5:1);spawnT=interval*rand(.8,1.2);
      const def=surge>0&&Math.random()<.6?pick(COLD):pick(THOUGHTS);
      spawnThought(def,MONK_HEAD.clone());
      if(Math.random()<.18)godSpeak(GOD_LINES);}
  }

  // 妄想の更新
  let gSum=0;
  for(let i=thoughts.length-1;i>=0;i--){const th=thoughts[i];
    if(th.state==='dead'){thoughts.splice(i,1);continue;}
    th.age+=dt;th.bump=Math.max(0,th.bump-dt);
    const pop=Math.min(1,th.age*4);const popS=pop<1?pop*1.15:1;const bumpS=1+th.bump*1.2;
    if(th.state==='fly'){
      const p=Math.min(1,th.age/th.T),e=1-(1-p)*(1-p);
      th.sp.position.lerpVectors(th.from,th.end,e);
      th.sp.position.x+=Math.sin(th.age*2+th.wob)*.25+(th.kind==='fast'?Math.sin(th.age*7)*.55*e:0);
      th.sp.position.y+=Math.sin(th.age*3+th.wob)*.12;
      const k=p>.72?(.5+.5*Math.sin(th.age*18))*(p-.72)/.28:0;th.mat.color.setRGB(1,1-.45*k,1-.45*k);
      th.sp.scale.set(3*th.s*popS*bumpS,1.5*th.s*popS*bumpS,1);
      if(p>=1&&state==='play')makeStuck(th);
    }else{
      const R=ORB*(state==='fail'?1+Math.min(endT,2)*.25:1);
      th.ang+=dt*(state==='fail'?1.4:.55);
      const hy=monk.position.y+1.95;
      tmpV2.set(Math.cos(th.ang)*R,hy+.35+Math.sin(t*1.3+th.wob)*.18,monk.position.z+Math.sin(th.ang)*R*.6);
      const ss=.55*th.s*(state==='fail'?1+Math.min(endT,2)*.2:1);
      if(th.state==='suck'){th.suckT+=dt/.6;const e=Math.min(1,th.suckT);th.sp.position.lerpVectors(th.suckFrom,tmpV2,e*e);
        const sc=lerp(th.s,ss,e);th.sp.scale.set(3*sc*bumpS,1.5*sc*bumpS,1);if(e>=1)th.state='stick';}
      else{th.sp.position.copy(tmpV2);th.sp.scale.set(3*ss*bumpS,1.5*ss*bumpS,1);
        if(state==='play'){th.breed-=dt;if(th.breed<=0){th.breed=rand(7,10);
          const kid=th.def.kids?{t:pick(th.def.kids),e:th.def.e,food:th.def.food}:{t:pick(THOUGHTS).t,e:pick(THOUGHTS).e};
          spawnThought(kid,th.sp.position.clone(),true);burst(th.sp.position,'#d4452f',10,2);}}}
      gSum+=th.weight;
    }
  }
  if(state==='play'){gauge=gSum;if(gauge>=100)doFail();}

  updArrows(dt);updParticles(dt);

  // 滅ポップ
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life-=dt;p.sp.position.y+=dt*1.4;p.sp.material.opacity=Math.max(0,p.life/.7);
    if(p.life<=0){scene.remove(p.sp);p.sp.material.dispose();pops.splice(i,1);}}

  // 神々
  const panic=clamp(gauge/100,0,1);
  gods.forEach((gd,i)=>{gd.cd-=dt;gd.recoil=Math.max(0,gd.recoil-dt);gd.moodT-=dt;
    let x=gd.base.x,y=gd.base.y+Math.sin(t*1.6+gd.phase)*.15,z=gd.base.z;
    if(state==='play'){const j=(.02+panic*.09+surgeK*.03);x+=rand(-j,j);y+=rand(-j,j);
      if(gd.moodT<=0)setGodFace(gd,panic>.55||surge>0?'panic':'focus');}
    if(state==='clear'){y+=Math.abs(Math.sin(t*6+i))*.6;}
    if(state==='fail'){y-=Math.min(endT,1.5)*.3;}
    z-=gd.recoil*.8;gd.g.position.set(x,y,z);
    gd.body.rotation.z=state==='fail'?lerp(gd.body.rotation.z,.35*gd.side,dt*2):Math.sin(t*2+gd.phase)*.04*(1+panic*3);
  });

  // 和尚
  monkMoodT-=dt;
  if(state==='play'||state==='title'){
    let m=monkMoodT>0?monkMood:(gauge>=60||surge>0?'strain':'calm');setMonkFace(m);
    peekT-=dt;if(peekT<=0){peekT=rand(8,14);tempMonk('peek',.8);}
    monkSpeakT-=dt;if(monkSpeakT<=0){monkSpeakT=rand(5,9);
      speak(monkOwner,gauge>60?'煩悩が…煩悩が…':pick(MONK_LINES),{parent:monk,off:new THREE.Vector3(portrait?-1.3:-1.8,2.3,.4),life:1.6,s:.9});}
    const shiver=surgeK*.035+panic*.015;monk.position.x=rand(-shiver,shiver);
    monk.scale.y=1+Math.sin(t*1.4)*.01;
  }
  if(state==='fail'){endT+=dt;monk.rotation.z=lerp(monk.rotation.z,.42,dt*1.5);monk.rotation.x=lerp(monk.rotation.x,.18,dt*1.5);
    monk.position.y=lerp(monk.position.y,.6,dt*1.5);robeMat.color.lerp(tmpC.set(0x8c8f96),dt);
    camera.position.lerp(tmpV.set(0,3.6,portrait?8:7),dt*1.2);camera.lookAt(0,2.6,0);}
  if(state==='clear'){endT+=dt;monk.position.y=lerp(monk.position.y,1.8,dt*1.2);halo.material.opacity=Math.min(1,endT);halo.rotation.z+=dt;
    goldLight.intensity=Math.min(2,endT*1.5);goldLight.position.set(0,monk.position.y+2,2);
    if(Math.random()<.6)emit(rand(-1.5,1.5),monk.position.y+rand(0,2.5),rand(-.5,1),0,rand(.5,1.5),0,1.2,'#f0c65a',-.5);
    camera.position.lerp(tmpV.set(0,4.2,portrait?9:8),dt*1.2);camera.lookAt(0,3.2,0);}
  if(state==='play'){camera.position.copy(camBase);
    if(!reduceMotion&&surgeK>.05){camera.position.x+=rand(-.07,.07)*surgeK;camera.position.y+=rand(-.07,.07)*surgeK;}
    camera.lookAt(camLook);}

  // セリフ
  for(let i=speeches.length-1;i>=0;i--){const s=speeches[i];s.life-=dt;
    s.sp.material.opacity=Math.min(1,s.life*3);s.sp.position.y+=dt*.15;
    if(s.life<=0){s.sp.parent&&s.sp.parent.remove(s.sp);s.tex.dispose();s.sp.material.dispose();if(s.owner.speech===s)s.owner.speech=null;speeches.splice(i,1);}}

  updHud();
  renderer.render(scene,camera);
}

addEventListener('resize',layout);
layout();
loop();
// フォント読み込み後に神名ラベルと「滅」を描き直す
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load(`700 30px "Zen Maru Gothic"`),document.fonts.load(`900 40px "Zen Maru Gothic"`),document.fonts.load(`40px "Dela Gothic One"`)])
  .then(()=>{gods.forEach(gd=>{const old=gd.lbl.material.map;gd.lbl.material.map=labelTex(gd.def.name);gd.lbl.material.needsUpdate=true;old.dispose();});
    const c=metsuTex,g=c.getContext('2d');g.clearRect(0,0,128,128);g.font='900 100px "Dela Gothic One",serif';g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=10;g.strokeStyle='#f3ead6';g.strokeText('滅',64,68);g.fillStyle='#d4452f';g.fillText('滅',64,68);metsuTexture.needsUpdate=true;}).catch(()=>{});
}
};
(function boot(){
  const run=()=>{try{window.startMain();}catch(e){showErr('起動エラー: '+e.message);}};
  if(window.THREE)return run();
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  sc.onload=run;sc.onerror=()=>showErr('3Dエンジン（three.js）を読み込めませんでした。通信状況を確認して再読み込みしてね');document.head.appendChild(sc);
})();
</script>
