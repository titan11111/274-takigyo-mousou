<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>滝行と煩悩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@300;500;900&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1c26; --paper:#f3ead6; --shu:#d4452f; --moss:#5b7d4c; --gold:#f0c65a; --mist:#cfe6f2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#0f1c26; --paper:#f3ead6; } }
:root[data-theme="dark"]{ --ink:#0f1c26; --paper:#f3ead6; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;width:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--ink);color:var(--paper);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{scroll-padding-top:env(safe-area-inset-top,0px);position:fixed}
body{position:fixed;touch-action:none}
::selection{background:transparent;color:inherit}
body.titling #mute{visibility:hidden;pointer-events:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;
  display:flex;gap:12px;align-items:center;justify-content:space-between}
#gaugeWrap{flex:1;max-width:420px;display:flex;align-items:center;gap:8px}
#gaugeWrap span.lbl{font-family:"Dela Gothic One",sans-serif;font-size:15px;letter-spacing:.05em}
#gauge{flex:1;height:14px;border-radius:8px;background:rgba(255,255,255,.12);border:2px solid var(--paper);overflow:hidden}
#gaugeFill{height:100%;width:0;background:var(--moss);transition:width .2s,background .3s}
#gaugeFill.hot{background:var(--shu)}
#gaugePct{font-weight:900;font-size:14px;min-width:3.2em;text-align:right}
#kills{font-weight:900;font-size:15px;white-space:nowrap}
#kills b{font-family:"Dela Gothic One",sans-serif;font-size:20px;color:var(--gold)}
#mute{pointer-events:auto;background:rgba(255,255,255,.1);border:2px solid var(--paper);color:var(--paper);border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
#mute:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-family:"Dela Gothic One",sans-serif;
  font-size:clamp(26px,7vw,54px);color:var(--paper);-webkit-text-stroke:2px var(--shu);text-shadow:0 4px 0 var(--shu);opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:scale(1)}
#result{align-items:flex-end}
canvas{transition:filter 1.8s ease}
canvas.bw{filter:grayscale(1) contrast(1.3) brightness(.92)}
body.titling #hud{display:none}
#title{position:fixed;inset:0;display:none;cursor:pointer;z-index:5;overflow:hidden}
#title.show{display:block}
#title .grain{position:absolute;inset:-50%;opacity:.16;background-image:var(--grain);mix-blend-mode:overlay;animation:grain .6s steps(4) infinite;pointer-events:none}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-5%,3%)}50%{transform:translate(4%,-4%)}75%{transform:translate(-3%,-2%)}100%{transform:translate(2%,5%)}}
#title .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.8) 100%)}
#title .bar{position:absolute;left:0;right:0;height:11vh;background:#000}
#title .bar.top{top:0}
#title .bar.bot{bottom:0;height:calc(11vh + env(safe-area-inset-bottom,0px))}
#title .ttl{position:absolute;top:50%;right:11%;transform:translateY(-50%);writing-mode:vertical-rl;display:flex;align-items:center;gap:.8em}
#title h1{margin:0;font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;font-size:clamp(54px,13vw,116px);
  letter-spacing:.2em;color:#f4f1ea;text-shadow:0 0 30px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9);opacity:0;animation:ttlIn 3.4s ease .5s forwards}
@keyframes ttlIn{0%{opacity:0;filter:blur(6px)}8%{opacity:.8}10%{opacity:0}18%{opacity:.9}20%{opacity:.1}35%{opacity:1;filter:blur(0)}100%{opacity:1;filter:blur(0)}}
#title .seal{writing-mode:horizontal-tb;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(16px,3.6vw,24px);color:#d4452f;
  border:2px solid #d4452f;padding:.18em .28em;line-height:1;opacity:0;animation:fadeIn 1.2s ease 3.4s forwards}
#title .tap{position:absolute;left:0;right:0;bottom:calc(11vh + env(safe-area-inset-bottom,0px) + 16px);text-align:center;
  font-family:"Shippori Mincho B1",serif;font-size:14px;letter-spacing:.5em;color:rgba(244,241,234,.8);opacity:0;animation:fadeIn 1.5s ease 4s forwards,breathe 3s ease-in-out 5.5s infinite}
@keyframes fadeIn{to{opacity:1}}
@keyframes breathe{0%,100%{opacity:.8}50%{opacity:.3}}

#title .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,rgba(0,0,0,0) 1px 3px);mix-blend-mode:multiply}
#title .frame i{position:absolute;width:28px;height:28px;border:0 solid rgba(236,236,236,.7)}
#title .frame i:nth-child(1){top:calc(11vh + 12px);left:14px;border-top-width:2px;border-left-width:2px}
#title .frame i:nth-child(2){top:calc(11vh + 12px);right:14px;border-top-width:2px;border-right-width:2px}
#title .frame i:nth-child(3){bottom:calc(11vh + env(safe-area-inset-bottom,0px) + 12px);left:14px;border-bottom-width:2px;border-left-width:2px}
#title .frame i:nth-child(4){bottom:calc(11vh + env(safe-area-inset-bottom,0px) + 12px);right:14px;border-bottom-width:2px;border-right-width:2px}
#title .osd{position:absolute;font-family:"Share Tech Mono","Zen Kaku Gothic New",monospace;font-size:clamp(10px,2.8vw,13px);letter-spacing:.12em;color:rgba(236,236,236,.82);white-space:nowrap}
#title .osd.tl{top:calc(11vh - 22px);left:16px}
#title .osd.tr{top:calc(11vh - 22px);right:16px}
#title .osd.bl{bottom:calc(11vh + env(safe-area-inset-bottom,0px) - 22px);left:16px}
#title .osd.br{bottom:calc(11vh + env(safe-area-inset-bottom,0px) - 22px);right:16px}
#title .rec{color:#d4452f;animation:recb 1s steps(1) infinite}
@keyframes recb{50%{opacity:0}}
#title h1 span{display:block}
#title h1 .l2{margin-top:2.2em}
#title h1{font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif !important;font-weight:900 !important;color:#ececec !important;letter-spacing:.32em !important;
  text-shadow:0 0 1px #000,0 0 26px rgba(0,0,0,.9) !important}
#title h1.glitch{transform:translateX(4px) skewX(-8deg);text-shadow:-5px 0 rgba(255,255,255,.55),5px 0 rgba(90,90,90,.8) !important;clip-path:inset(12% 0 38% 0)}
#title h1.glitch2{transform:translateX(-3px);opacity:.55 !important}
#title .tap{font-family:"Share Tech Mono","Zen Kaku Gothic New",monospace !important;letter-spacing:.3em !important;color:rgba(236,236,236,.85) !important;bottom:calc(11vh + env(safe-area-inset-bottom,0px) + 30px) !important}
@media (max-width:420px){#title .osd.br{display:none}}
#cut{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
@media (prefers-reduced-motion: reduce){#title .grain{animation:none}#title h1{animation:fadeIn 1s forwards}}
#combo{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 60px);font-family:"Dela Gothic One",sans-serif;font-size:22px;color:var(--gold);opacity:0;transition:opacity .2s;pointer-events:none}
#combo.on{opacity:1}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(10,20,28,.55)}
.ov.show{display:flex}
.card{display:flex;flex-direction:row-reverse;gap:18px;max-width:560px;width:100%;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:20px;padding:22px 20px;box-shadow:8px 8px 0 var(--shu);max-height:100%;overflow:auto}
.tate{writing-mode:vertical-rl;font-family:"Shippori Mincho B1","Yu Mincho",serif;font-weight:800;margin:0;font-size:clamp(40px,11vw,68px);line-height:1.05;color:var(--ink);letter-spacing:.06em}
.body{flex:1;font-size:15px;line-height:1.85}
.body p{margin:0 0 .7em}
.lead{font-weight:900;font-size:17px}
.stats{font-weight:700;border-top:2px dashed var(--ink);padding-top:.6em}
.body button{margin-top:.4em;width:100%;padding:14px;border:3px solid var(--ink);border-radius:14px;background:var(--shu);color:var(--paper);
  font-family:"Dela Gothic One",sans-serif;font-size:20px;cursor:pointer}
.body button:active{transform:translateY(2px)}
.gods{font-size:13px;opacity:.8}
</style>

<body>
<div id="title" class="show" role="button" tabindex="0" aria-label="修行を始める">
  <div class="grain"></div><div class="vig"></div><div class="bar top"></div><div class="bar bot"></div>
  <div class="scan"></div><div class="frame"><i></i><i></i><i></i><i></i></div>
  <div class="osd tl"><span class="rec">●</span> REC　<span id="camLbl">CAM-01　滝壺</span></div>
  <div class="osd tr" id="clock">----.--.--　--:--:--</div>
  <div class="osd bl">SUBJECT No.108　水温 <span id="wt">6.8</span>℃　水圧 <span id="wp">2.41</span>t/㎡</div>
  <div class="osd br">煩悩検出 <span id="bn">0.000</span></div>
  <div class="ttl"><h1 id="ttlH"><span>滝行と</span><span class="l2">煩悩</span></h1></div>
  <div class="tap">[ 触れて　修行を開始 ]</div><div id="cut"></div>
</div>
<div id="hud">
  <div id="gaugeWrap"><span class="lbl">煩悩</span><div id="gauge"><div id="gaugeFill"></div></div><span id="gaugePct">0%</span></div>
  <div id="kills">撃破 <b id="killN">0</b>/108</div>
  <button id="mute" aria-label="音のオンオフ">🔊</button>
</div>
<div id="banner"></div>
<div id="combo"></div>

<div id="flash"></div>

<div id="result" class="ov">
  <div class="card">
    <h2 class="tate" id="resTitle">修行失敗</h2>
    <div class="body">
      <p class="lead" id="resLead"></p>
      <p id="resMsg"></p>
      <p class="stats" id="resStats"></p>
      <button id="againBtn">もう一度、滝へ</button>
    </div>
  </div>
</div>

<div id="err" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:#f3ead6;color:#0f1c26;border:3px solid #d4452f;border-radius:12px;padding:10px 12px;font-size:13px;z-index:9;white-space:pre-wrap"></div>
<script>
function showErr(m){var e=document.getElementById('err');e.style.display='block';e.textContent+= (e.textContent?'\n':'')+'⚠ '+m;}
window.addEventListener('error',function(e){showErr(e.message||'読み込みエラー');});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.startMain=()=>{
document.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ============ 妄想データ ============ */
const THOUGHTS=[
 {t:'まんじゅう食いたいな',e:'🍡',food:1,kids:['こしあん派','いや、つぶあん']},
 {t:'温かい風呂に入りたい',e:'♨️'},
 {t:'帰ってゲームしたい',e:'🎮',type:'fast',kids:['あと1面だけ','ガチャ回したい']},
 {t:'ラーメン大盛り',e:'🍜',food:1,type:'big',kids:['チャーハン追加','餃子もつけて']},
 {t:'金持ちになりてー',e:'💰',kids:['札束の風呂','宝くじ当たれ']},
 {t:'松茸の季節だなあ',e:'🍄',food:1,kids:['土瓶蒸し…','焼き松茸にすだち']},
 {t:'爆睡してー',e:'💤',type:'big',kids:['二度寝したい','昼寝もしたい']},
 {t:'甘い桃が食べたい',e:'🍑',food:1},
 {t:'ビールぐいっと',e:'🍺',food:1,kids:['枝豆もほしい']},
 {t:'猫をなでたい',e:'🐈'},
 {t:'焼肉食べ放題',e:'🥩',food:1,kids:['タン塩から','〆は冷麺']},
 {t:'布団から出たくない',e:'🛏️'},
 {t:'Wi-Fiどこ？',e:'📶',type:'fast'},
 {t:'今日の晩ごはん何？',e:'🍚',food:1},
 {t:'推しに会いたい',e:'✨',type:'fast'},
];
const COLD=[
 {t:'寒い寒い寒い',e:'🥶',type:'fast'},
 {t:'こたつ入りたい',e:'🍊',kids:['みかん食べたい','ずっとこたつ']},
 {t:'熱燗ください',e:'🍶',food:1},
 {t:'温かい風呂に入りたい',e:'♨️',kids:['肩までつかりたい']},
 {t:'おでん食べたい',e:'🍢',food:1,kids:['大根しみしみ']},
];
const GOD_LINES=['来たぞ！','射てーっ！','させるかっ！','まんじゅうは後だ！','和尚、耐えろ！','そこだっ！','手がつる…','見えた！'];
const GOD_PANIC=['やばいやばい','とりついてる！','誰か増援を！','天照さま呼んで！','神の威信が！','矢が足りん！'];
const GOD_SURGE=['和尚が冷えるぞ！','滝が荒ぶってる！','寒さで妄想が！'];
const MONK_LINES=['南無阿弥陀仏…','般若波羅蜜多…','オン アビラウンケン ソワカ','…（歯を食いしばる）','喝ッ！','色即是空…','まだまだ…','臨兵闘者皆陣列在前','（ゴクリ）','…無'];
const GODS_DEF=[
 {name:'射抜ノ神',robe:0xc8402f},{name:'早矢比売',robe:0x3e7cb1},{name:'飯断ノ神',robe:0x5b8c4a},
 {name:'眠気祓ノ尊',robe:0x8a5aa8},{name:'無心大明神',robe:0xe0b040}
];

/* ============ 基本 ============ */
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){showErr('この端末/ブラウザでは3D（WebGL）が使えないみたい');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10202c);
scene.fog=new THREE.Fog(0x10202c,20,48);
const camera=new THREE.PerspectiveCamera(50,1,0.1,120);
const camBase=new THREE.Vector3(), camLook=new THREE.Vector3(0,6.3,0);
let W=1,H=1,halfW=8,TS=1,ORB=1.7,portrait=false;

scene.add(new THREE.HemisphereLight(0xa9cfe6,0x1a2a20,0.75));
const moonL=new THREE.DirectionalLight(0xfff1d6,0.85); moonL.position.set(-6,12,10); scene.add(moonL);
const goldLight=new THREE.PointLight(0xffd36a,0,12); goldLight.position.set(0,3,2); scene.add(goldLight);

const lam=c=>new THREE.MeshLambertMaterial({color:c});

/* 背景：崖・池・木・月・星 */
const cliff=new THREE.Mesh(new THREE.BoxGeometry(44,22,4),lam(0x1c2a2c)); cliff.position.set(0,8,-3.6); scene.add(cliff);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,40),lam(0x1d2d21)); ground.rotation.x=-Math.PI/2; ground.position.set(0,-0.01,5); scene.add(ground);
const pool=new THREE.Mesh(new THREE.CircleGeometry(6.5,40),new THREE.MeshPhongMaterial({color:0x2d5d72,shininess:80,transparent:true,opacity:.92}));
pool.rotation.x=-Math.PI/2; pool.position.set(0,0.02,0.5); scene.add(pool);
for(let i=0;i<22;i++){
  const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.4,1.3)),lam(i%3?0x2e3b3c:0x3b4d3a));
  const a=rand(0,Math.PI*2), d=rand(6.2,9); r.position.set(Math.cos(a)*d, rand(0,.6), Math.sin(a)*d*0.5-0.5);
  if(r.position.z>3) r.position.z=rand(-2.4,-1.4);
  r.rotation.set(rand(0,3),rand(0,3),0); scene.add(r);
}
for(let i=0;i<5;i++){ // 苔の岩 on cliff edge
  const m=new THREE.Mesh(new THREE.SphereGeometry(rand(.8,1.6),10,8),lam(0x3f5d38));
  m.position.set(rand(-9,9)+(i%2?4:-4), rand(12,16), -1.8); scene.add(m);
}
for(let i=0;i<14;i++){
  const s=rand(-1,1)>0?1:-1, h=rand(3,6);
  const t=new THREE.Mesh(new THREE.ConeGeometry(rand(.9,1.5),h,7),lam(0x1a3322));
  t.position.set(s*rand(7.5,16),h/2,rand(-2,1)); scene.add(t);
}
const moon=new THREE.Mesh(new THREE.SphereGeometry(1.4,20,16),new THREE.MeshBasicMaterial({color:0xfff2c8})); moon.position.set(-13,19,-22); scene.add(moon);
{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<300;i++)a.push(rand(-50,50),rand(14,40),rand(-40,-25));
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xdfe9f2,size:.14})));}

/* 滝 */
function waterCanvas(alpha){const c=document.createElement('canvas');c.width=128;c.height=512;const g=c.getContext('2d');
  g.fillStyle=`rgba(160,205,228,${alpha})`;g.fillRect(0,0,128,512);
  for(let i=0;i<150;i++){const x=Math.random()*128,w=rand(1,5),y=Math.random()*512,h=rand(40,220);
    g.fillStyle=`rgba(255,255,255,${rand(.15,.65)})`;g.fillRect(x,y,w,h);if(y+h>512)g.fillRect(x,y-512,w,h);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const fallTex=waterCanvas(.5); fallTex.repeat.set(2,2.5);
const fall=new THREE.Mesh(new THREE.PlaneGeometry(5,17),new THREE.MeshBasicMaterial({map:fallTex,transparent:true,opacity:.9,depthWrite:false}));
fall.position.set(0,8.4,-1.4); scene.add(fall);
const streamTex=waterCanvas(.35);
const stream=new THREE.Mesh(new THREE.PlaneGeometry(1,11.4),new THREE.MeshBasicMaterial({map:streamTex,transparent:true,opacity:.55,depthWrite:false}));
stream.position.set(0,8.95,0.22);stream.scale.y=.9; scene.add(stream);

/* しめ縄 */
{const pts=[];for(let i=0;i<=20;i++){const x=lerp(-2.9,2.9,i/20);pts.push(new THREE.Vector3(x,13.4-0.5*Math.cos((i/20-.5)*Math.PI),-0.9));}
 const rope=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),40,.12,6),lam(0xc9a868)); scene.add(rope);
 for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(.22,.6),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));

  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;

  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}

    if(shot!==lastShot){lastShot=shot;$('camLbl').textContent=['CAM-01　滝壺','CAM-02　顔面','CAM-03　合掌','CAM-04　仰角'][shot];const c=$('cut');c.style.transition='none';c.style.opacity=1;setTimeout(()=>{c.style.transition='opacity .25s';c.style.opacity=0;},90);}
    setMonkFace(shot===1&&k>.6?'strain':'calm');
    const hw=headW;
    if(shot===0){camera.position.set(1.4-k*.4,1.05+k*.2,5.6-k*.7);camera.lookAt(0,2.7,0);}
    else if(shot===1){camera.position.set(hw.x+.32-k*.12,hw.y+.03,hw.z+1.05-k*.3);camera.lookAt(hw.x,hw.y-.02,hw.z);}
    else if(shot===2){tmpV2.copy(handW[0]).lerp(handW[1],.5);monk.localToWorld(tmpV2);camera.position.set(tmpV2.x-.35+k*.1,tmpV2.y+.12,tmpV2.z+.95-k*.2);camera.lookAt(tmpV2.x,tmpV2.y+.05,tmpV2.z);}
    else{camera.position.set(hw.x+.25,hw.y-1.1+k*.15,hw.z+1.5-k*.2);camera.lookAt(hw.x,hw.y+.35,hw.z);}
  }
  if(state==='play'){camera.position.copy(camBase);
    if(!reduceMotion&&surgeK>.05){camera.position.x+=rand(-.07,.07)*surgeK;camera.position.y+=rand(-.07,.07)*surgeK;}
    if(!reduceMotion&&punch>0){camera.position.x+=rand(-1,1)*punch*.5;camera.position.y+=rand(-1,1)*punch*.5;}
    camera.lookAt(camLook);}

  // セリフ
  for(let i=speeches.length-1;i>=0;i--){const s=speeches[i];s.life-=dt;
    s.sp.material.opacity=Math.min(1,s.life*3);s.sp.position.y+=dt*.15;
    if(s.life<=0){s.sp.parent&&s.sp.parent.remove(s.sp);s.tex.dispose();s.sp.material.dispose();if(s.owner.speech===s)s.owner.speech=null;speeches.splice(i,1);}}

  updHud();
  titleFrame++;
  if(state!=='title'||(titleFrame&1)) renderer.render(scene,camera);
}

addEventListener('resize',layout);
layout();
loop();
// フォント読み込み後に神名ラベルと「滅」を描き直す
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load(`700 30px "Zen Maru Gothic"`),document.fonts.load(`900 40px "Zen Maru Gothic"`),document.fonts.load(`40px "Dela Gothic One"`)])
  .then(()=>{gods.forEach(gd=>{const old=gd.lbl.material.map;gd.lbl.material.map=labelTex(gd.def.name);gd.lbl.material.needsUpdate=true;old.dispose();});
    const c=metsuTex,g=c.getContext('2d');g.clearRect(0,0,128,128);g.font='900 100px "Dela Gothic One",serif';g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=10;g.strokeStyle='#f3ead6';g.strokeText('滅',64,68);g.fillStyle='#d4452f';g.fillText('滅',64,68);metsuTexture.needsUpdate=true;}).catch(()=>{});
}
};
(function boot(){
  const run=()=>{try{window.startMain();}catch(e){showErr('起動エラー: '+e.message);}};
  if(window.THREE)return run();
  const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  sc.onload=run;sc.onerror=()=>showErr('3Dエンジン（three.js）を読み込めませんでした。通信状況を確認して再読み込みしてね');document.head.appendChild(sc);
})();
</script>
